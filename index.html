  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, increment, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'showup-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

    let db = null;
    let auth = null;
    let currentUser = null;

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);

      const initAuth = async () => {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      };

      initAuth().catch(console.warn);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          setupCloudListeners();
        }
      });
    } catch (e) {
      console.warn("Cloud sync initialization fallback: local mode enabled.");
    }

    const todayKey = new Date().toISOString().slice(0, 10);

    function setupCloudListeners() {
      if (!db || !currentUser) return;

      const counterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_counters', todayKey);
      onSnapshot(counterDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data && typeof data.count === 'number') {
            if (data.count > window.globalShowedUpCount) {
              triggerCheckAnimation();
            }
            window.globalShowedUpCount = data.count;
            localStorage.setItem('showUp_global_counter', window.globalShowedUpCount.toString());
            window.updateGlobalCounterUI();
          }
        } else {
          setDoc(counterDocRef, { count: window.globalShowedUpCount || 0 }, { merge: true }).catch(console.warn);
        }
      }, (err) => console.warn("Cloud counter listener:", err));

      const squadsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'squads');
      onSnapshot(squadsColRef, (snap) => {
        const cloudSquads = [];
        snap.forEach(docSnap => cloudSquads.push({ id: docSnap.id, ...docSnap.data() }));
        if (cloudSquads.length > 0) {
          window.squadsData = cloudSquads;
          localStorage.setItem('showUp_squads_data', JSON.stringify(window.squadsData));
          window.renderSquads();
        }
      }, (err) => console.warn("Cloud squads listener:", err));

      // CLOUD HEATMAP USER LOCATIONS LISTENER
      const heatmapColRef = collection(db, 'artifacts', appId, 'public', 'data', 'heatmap_points');
      onSnapshot(heatmapColRef, (snap) => {
        const points = [];
        snap.forEach(docSnap => points.push({ id: docSnap.id, ...docSnap.data() }));
        if (points.length > 0) {
          window.heatmapDataPoints = points;
          window.renderGlobalHeatmap();
        }
      }, (err) => console.warn("Cloud heatmap listener:", err));
    }

    window.incrementCloudGlobalCounter = async function() {
      if (!db || !currentUser) {
        window.globalShowedUpCount += 1;
        localStorage.setItem('showUp_global_counter', window.globalShowedUpCount.toString());
        window.updateGlobalCounterUI();
        triggerCheckAnimation();
        return;
      }

      try {
        const counterDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'daily_counters', todayKey);
        await setDoc(counterDocRef, { count: increment(1) }, { merge: true });

        // PUBLISH USER COARSE LOCATION POINT TO HEATMAP
        if (window.currentUserLocation) {
          const userLocDoc = doc(db, 'artifacts', appId, 'public', 'data', 'heatmap_points', currentUser.uid);
          await setDoc(userLocDoc, {
            lat: window.currentUserLocation.lat,
            lng: window.currentUserLocation.lng,
            city: window.currentUserLocation.city || 'Unknown',
            state: window.currentUserLocation.state || 'VA',
            country: window.currentUserLocation.country || 'USA',
            continent: window.currentUserLocation.continent || 'North America',
            updatedAt: Date.now()
          }, { merge: true });
        }

        triggerCheckAnimation();
      } catch (err) {
        window.globalShowedUpCount += 1;
        localStorage.setItem('showUp_global_counter', window.globalShowedUpCount.toString());
        window.updateGlobalCounterUI();
        triggerCheckAnimation();
      }
    };

    window.syncSquadToCloud = async function(squadObj) {
      if (!db || !currentUser || !squadObj || !squadObj.id) return;
      try {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'squads', squadObj.id);
        await setDoc(docRef, squadObj, { merge: true });
      } catch (e) {
        console.warn("Cloud squad sync exception:", e);
      }
    };

    function triggerCheckAnimation() {
      const headerIcon = document.getElementById('header-check-icon');
      const heroIcon = document.getElementById('hero-check-icon');

      if (headerIcon) {
        headerIcon.classList.remove('animate-check-pop');
        void headerIcon.offsetWidth;
        headerIcon.classList.add('animate-check-pop');
      }
      if (heroIcon) {
        heroIcon.classList.remove('animate-check-pop');
        void heroIcon.offsetWidth;
        heroIcon.classList.add('animate-check-pop');
      }
    }
  </script>

    function detectUserGeoLocation() {
      fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
          if (data && data.latitude && data.longitude) {
            window.currentUserLocation = {
              lat: data.latitude,
              lng: data.longitude,
              city: data.city || 'Local Area',
              state: data.region_code || data.region || 'VA',
              country: data.country_name || 'USA',
              continent: data.continent_code === 'EU' ? 'Europe' : data.continent_code === 'AS' ? 'Asia' : 'North America'

              leafletMap.setView([window.currentUserLocation.lat, window.currentUserLocation.lng], 4);

    window.initGlobalMap = function() {
      const mapContainer = document.getElementById('global-map-canvas');
      if (!mapContainer || leafletMap) return;

      try {
        leafletMap = L.map('global-map-canvas', {
          center: [25, 0],
          zoom: 2,
          minZoom: 2,
          maxZoom: 16,
          zoomControl: false
        });

        // Add sleek CartoDB Dark Matter tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(leafletMap);

        L.control.zoom({ position: 'topright' }).addTo(leafletMap);

        markerClusterGroup = L.markerClusterGroup({
          showCoverageOnHover: false,
          maxClusterRadius: 50,
          iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            return L.divIcon({
              html: `<div class="custom-cluster-icon w-9 h-9 text-xs"><i class="fa-solid fa-check-double mr-1"></i>${count}</div>`,
              className: 'custom-cluster-wrapper',
              iconSize: L.point(36, 36)
            });
          }
        });

        leafletMap.addLayer(markerClusterGroup);

        leafletMap.on('zoomend', updateMapScopeSummary);
        window.renderGlobalHeatmap();
      } catch (e) {
        console.warn("Leaflet map initialization:", e);
      }
    };

    window.renderGlobalHeatmap = function() {
      if (!leafletMap || !markerClusterGroup) {
        window.initGlobalMap();
        return;
      }

      markerClusterGroup.clearLayers();

      const userIcon = L.divIcon({
        html: `<div class="custom-user-marker"><i class="fa-solid fa-check text-[10px]"></i></div>`,
        className: 'custom-user-marker-wrapper',
        iconSize: L.point(24, 24)
      });

      const points = window.heatmapDataPoints || [];
      document.getElementById('map-marker-count').innerText = `${points.length} Locations`;

      points.forEach(pt => {
        if (pt.lat && pt.lng) {
          const marker = L.marker([pt.lat, pt.lng], { icon: userIcon });
          marker.bindPopup(`
            <div class="text-center font-sans space-y-1">
              <div class="font-extrabold theme-text flex items-center justify-center gap-1">
                <i class="fa-solid fa-check-double text-xs"></i>
                <span>${pt.city || 'Active User'}, ${pt.state || ''}</span>
              </div>
              <div class="text-[10px] text-slate-400 font-semibold">${pt.country || 'Global'} (${pt.continent || 'World'})</div>
              <span class="inline-block bg-emerald-500/15 text-emerald-400 text-[9px] font-bold px-2 py-0.5 rounded-full mt-1">Showed Up Today</span>
            </div>
          `);
          markerClusterGroup.addLayer(marker);
        }
      });

      updateMapScopeSummary();
      renderTopRegionsBreakdown();
    };

    function updateMapScopeSummary() {
      if (!leafletMap) return;
      const zoom = leafletMap.getZoom();
      const badgeEl = document.getElementById('map-zoom-scope-badge');
      const labelEl = document.getElementById('map-scope-summary-label');

      if (zoom < 4) {
        if (badgeEl) badgeEl.innerText = "Continent Scope";
        if (labelEl) labelEl.innerText = "Summarized by Continent";
      } else if (zoom >= 4 && zoom < 7) {
        if (badgeEl) badgeEl.innerText = "Country Scope";
        if (labelEl) labelEl.innerText = "Summarized by Country";
      } else if (zoom >= 7 && zoom < 10) {
        if (badgeEl) badgeEl.innerText = "State / Regional Scope";
        if (labelEl) labelEl.innerText = "Summarized by State / Region";
      } else {
        if (badgeEl) badgeEl.innerText = "Street / Pin Scope";
        if (labelEl) labelEl.innerText = "Individual User Locations";
      }
    }

    function renderTopRegionsBreakdown() {
      const container = document.getElementById('map-top-regions-list');
      if (!container) return;

      const points = window.heatmapDataPoints || [];
      const regionCounts = {};
      points.forEach(p => {
        const key = p.state ? `${p.state}, ${p.country}` : (p.country || 'Global');
        regionCounts[key] = (regionCounts[key] || 0) + 1;
      });

      const sorted = Object.entries(regionCounts).sort((a,b) => b[1] - a[1]).slice(0, 4);

      container.innerHTML = sorted.map(([region, count]) => `
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between">
          <div class="truncate pr-1">
            <span class="text-[10px] font-bold text-slate-400 block truncate">${region}</span>

          </div>

        </div>
      `).join('') || '<div class="col-span-4 text-center py-2 text-slate-600 italic">No locations available</div>';
    }
